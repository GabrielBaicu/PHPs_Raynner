<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <style>
        .calc {
            border: 5px solid red;
            border-radius: 20px;

        .calc2 {
            border: 5px solid red;
            border-radius: 20px;

<body>
    <fieldset class="calc">
        <legend class="calc">CALCULADORA</legend>
        <form method="post" action="3soma.php">
            Digite o primeiro número (entre 1 e 5 Decilhôes)<br><input class="calc2" type="number" name="N1A" placeholder="Ex:9           " min="1" max="5000000000000000000000000000000000"><br>
            Digite o segundo número (entre 1 e 5 Decilhôes)<br><input class="calc2" type="number" name="N2A" placeholder="Ex:3           " min="1" max="5000000000000000000000000000000000"><br><br>
            <select name="OPER" required>
                <option class="calc2" value="soma">Soma</option>
                <option class="calc2" value="sub">Subtração</option>
                <option class="calc2" value="mult">Multiplicação</option>
                <option class="calc2" value="div">Divisão</option>
            </select>
            <br><br><input type="submit" value="Enviar">
        </form>
