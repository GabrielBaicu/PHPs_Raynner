<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Campanha de vacinas</title>
    <link rel="stylesheet" href="../_css/7pedro_vacinas.css">
</head>

<body>
    <fieldset>
        <legend class="legenda">
            <p class="textolegenda">campanha de vacinação</p>

        <form method="post" action="7pedro_vacinas.php">
            <label>Quanto tempo desde o seu ultimo checkup?<p></p><input type="text" placeholder="859 dias"
                    name="checkup" required></label>
            <p></p>
            <label>Esta com todas as vacinas em dia?<p></p></label>
            <label><input type="radio" name="vaci" value="Sim">Sim</label>
            <p></p>
            <label><input type="radio" name="vaci" value="Não, nao quero">Não, e não quero tomar</label>
            <p></p>
            <label><input type="radio" name="vaci" value="Não, quero">Não, e quero tomar</label>

            <input type="text" name="cronic">

            <label><input type="radio" name="doen" value="Sim">Sim</label>

</html>
